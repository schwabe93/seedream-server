<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seedream Gallery</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --border: #252535;
      --accent: #6d28d9;
      --text: #e8e8f0;
      --muted: #8b8ba8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #181828 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #101018ee;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title { font-weight: 700; font-size: 16px; }
    .spacer { flex: 1; }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .copy-prompt-btn.copied {
      border-color: var(--success);
      color: var(--success);
    }
    .meta { color: var(--muted); font-size: 12px; padding: 10px 16px; }
    .gallery-tools {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      padding: 12px 16px 4px;
    }
    .gallery-tools input, .gallery-tools select {
      min-height: 40px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); font-size: 12px;
    }
    .bulk-tools { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; }
    .card { position: relative; }
    .card-select { position:absolute; top:8px; left:8px; z-index:2; width:24px; height:24px; accent-color:var(--accent); }
    .favorite-btn.active { color:#f59e0b; border-color:#f59e0b; }
    .album-label { color:var(--text); font-size:10px; }
    .grid {
      padding: 0 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card img, .card video {
      width: 100%;
      display: block;
      background: #000;
      object-fit: cover;
    }
    .card img { aspect-ratio: 1; cursor: zoom-in; }
    .card video { aspect-ratio: 16/9; }
    .info {
      padding: 8px 10px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000000cc;
      z-index: 20;
    }
    .lightbox.show { display: flex; }
    .lightbox img, .lightbox video { max-width: 92vw; max-height: 92vh; border-radius: 10px; }
    .copy-fallback {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #000000cc;
    }
    .copy-fallback.show { display: flex; }
    .copy-fallback-card {
      width: min(560px, 100%);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }
    .copy-fallback-card h2 { margin: 0 0 8px; font-size: 16px; }
    .copy-fallback-card p { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .copy-fallback-card textarea {
      width: 100%;
      min-height: 160px;
      padding: 10px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Arial, sans-serif;
    }
    .copy-fallback-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
      z-index: 40;
      max-width: min(480px, calc(100vw - 24px));
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .dup-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000000cc;
      z-index: 25;
      padding: 16px;
    }
    .dup-modal.show { display: flex; }
    .dup-modal-card {
      width: min(720px, 100%);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .dup-modal-card h2 { margin: 0; font-size: 16px; }
    .dup-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .dup-status { color: var(--muted); font-size: 12px; min-height: 16px; }
    .dup-groups {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .dup-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .dup-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .dup-group-title code { color: var(--muted); font-size: 11px; }
    .dup-files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .dup-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }
    .dup-keep {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 11px;
      color: var(--muted);
      user-select: none;
      padding: 8px 6px;
      min-height: 44px;
      border-radius: 8px;
    }
    .dup-keep input { width: 18px; height: 18px; accent-color: var(--accent); }
    .dup-thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      background: #000;
      flex: none;
    }
    .dup-file-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .dup-file-name {
      font-size: 11px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dup-file-sub { font-size: 10px; color: var(--muted); }
    .dup-file-prompt {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 560px) {
      header { flex-wrap: wrap; }
      .gallery-tools { grid-template-columns: 1fr 1fr; padding-inline:10px; }
      .gallery-tools input { grid-column:1/-1; min-height:44px; }
      .gallery-tools select { min-height:44px; }
      .bulk-tools { padding-inline:10px; }
      .bulk-tools .btn { min-height:44px; }
      .grid { grid-template-columns: 1fr; padding-inline: 10px; }
      .info { align-items: flex-start; flex-direction: column; }
      .card-actions { justify-content: flex-start; width: 100%; }
      .card-actions .btn { min-height: 44px; }
      .dup-modal { padding: 8px; }
      .dup-modal-card { padding: 12px; }
      .dup-toolbar .btn, .dup-group-delete { min-height: 44px; }
      .dup-file { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Seedream Gallery</div>
    <div class="spacer"></div>
    <button class="btn" onclick="loadGallery()">Refresh</button>
    <a class="btn primary" href="/">Back to Studio</a>
  </header>
  <div class="gallery-tools">
    <input id="gallerySearch" type="search" placeholder="Search prompt, model, filename..." oninput="renderEnhancedGallery()" aria-label="Search gallery">
    <select id="galleryType" onchange="renderEnhancedGallery()"><option value="all">Images + videos</option><option value="image">Images</option><option value="video">Videos</option></select>
    <select id="galleryAlbum" onchange="renderEnhancedGallery()"><option value="all">All albums</option></select>
    <label class="btn"><input id="galleryFavoritesOnly" type="checkbox" onchange="renderEnhancedGallery()"> Favorites</label>
  </div>
  <div class="bulk-tools">
    <button class="btn" onclick="toggleSelectAllGallery()">Select visible</button>
    <button class="btn" onclick="bulkDownloadGallery()">Download selected</button>
    <button class="btn" id="galleryZipButton" onclick="downloadZipGallery(this)">Download ZIP</button>
    <button class="btn" onclick="bulkSetGalleryAlbum()">Move to album</button>
    <button class="btn" onclick="openDuplicatesPanel()">Find duplicates</button>
    <button class="btn" style="color:var(--danger)" onclick="bulkDeleteGallery()">Delete selected</button>
  </div>
  <div class="meta" id="meta">Loading outputs...</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No outputs found yet.</div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" alt="" style="display:none">
    <video id="lightboxVideo" controls style="display:none" onclick="event.stopPropagation()"></video>
  </div>

  <div class="copy-fallback" id="copyFallback" role="dialog" aria-modal="true" aria-labelledby="copyFallbackTitle" onclick="if(event.target===this)closeCopyFallback()">
    <div class="copy-fallback-card">
      <h2 id="copyFallbackTitle">Copy prompt manually</h2>
      <p>Automatic clipboard access is blocked on this HTTP connection. The prompt is selected below; long-press it and choose Copy.</p>
      <textarea id="copyFallbackText" readonly></textarea>
      <div class="copy-fallback-actions">
        <button class="btn primary" onclick="closeCopyFallback()">Close</button>
      </div>
    </div>
  </div>

  <div class="dup-modal" id="duplicatesModal" role="dialog" aria-modal="true" aria-labelledby="duplicatesTitle" onclick="if(event.target===this)closeDuplicatesModal()">
    <div class="dup-modal-card">
      <h2 id="duplicatesTitle">Duplicate files</h2>
      <div class="dup-toolbar">
        <button class="btn primary" id="dupKeepNewestBtn" onclick="deleteDuplicatesKeepNewest()">Keep newest only</button>
        <button class="btn" onclick="closeDuplicatesModal()">Close</button>
      </div>
      <div class="dup-status" id="dupStatus" role="status" aria-live="polite">Opening duplicate finder…</div>
      <div class="dup-groups" id="dupGroups"></div>
    </div>
  </div>
  <div class="sr-only" id="copyStatus" aria-live="polite"></div>
  <div class="toast" id="galleryToast" role="status" aria-live="polite"></div>

  <script src="/gallery-productivity.js"></script>
  <script>
    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    let promptByOutput = new Map();

    function normalizeOutputUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const parsed = new URL(raw, window.location.origin);
        if (parsed.origin !== window.location.origin || !parsed.pathname.startsWith('/outputs/')) return '';
        return parsed.pathname;
      } catch {
        return '';
      }
    }

    function addPromptMapping(map, outputUrl, prompt) {
      if (!outputUrl || !prompt) return;
      const normalized = normalizeOutputUrl(outputUrl);
      if (normalized) map.set(normalized, prompt);
    }

    function openImage(src) {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      const vid = document.getElementById('lightboxVideo');
      vid.pause(); vid.src = ''; vid.style.display = 'none';
      img.src = src; img.style.display = 'block';
      box.classList.add('show');
    }

    function openVideo(src) {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      const vid = document.getElementById('lightboxVideo');
      img.src = ''; img.style.display = 'none';
      vid.src = src; vid.style.display = 'block';
      box.classList.add('show');
      vid.play().catch(() => {});
    }

    function closeLightbox() {
      const box = document.getElementById('lightbox');
      const vid = document.getElementById('lightboxVideo');
      box.classList.remove('show');
      vid.pause();
      vid.src = '';
    }

    function download(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || '';
      a.target = '_blank';
      a.click();
    }

    function getPromptText(entry) {
      const prompt = String(entry?.promptFull || entry?.prompt || '').trim();
      if (entry?.promptUnavailable || (entry?.model === 'Recovered' && prompt === 'Recovered from server output')) return '';
      return prompt;
    }

    function showCopySuccess(button) {
      if (!button) return;
      const original = button.dataset.label || button.textContent;
      button.dataset.label = original;
      button.textContent = 'Copied';
      button.classList.add('copied');
      document.getElementById('copyStatus').textContent = 'Prompt copied to clipboard';
      window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove('copied');
      }, 1600);
    }

    function openCopyFallback(value) {
      const overlay = document.getElementById('copyFallback');
      const textarea = document.getElementById('copyFallbackText');
      textarea.value = value;
      overlay.classList.add('show');
      window.setTimeout(() => {
        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, value.length);
      }, 0);
    }

    function closeCopyFallback() {
      document.getElementById('copyFallback').classList.remove('show');
    }

    function copyWithSelection(value) {
      const ta = document.createElement('textarea');
      ta.value = value;
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.width = '1px';
      ta.style.height = '1px';
      ta.style.opacity = '0.01';
      ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      try {
        ta.focus({ preventScroll: true });
        ta.select();
        ta.setSelectionRange(0, value.length);
        return document.execCommand('copy');
      } finally {
        ta.remove();
      }
    }

    async function copyPrompt(text, button) {
      const value = String(text || '').trim();
      if (!value) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          if (!copyWithSelection(value)) throw new Error('execCommand copy failed');
        }
        showCopySuccess(button);
        return true;
      } catch (e) {
        openCopyFallback(value);
        return false;
      }
    }

    async function copyPromptForUrl(outputUrl, button) {
      const prompt = promptByOutput.get(normalizeOutputUrl(outputUrl)) || '';
      await copyPrompt(prompt, button);
    }

    async function fetchHistoryMap() {
      try {
        const r = await fetch('/api/store/atlasHistory');
        if (!r.ok) return new Map();
        const d = await r.json();
        let items = [];
        try { items = JSON.parse(d.value); } catch { items = []; }
        const map = new Map();
        (Array.isArray(items) ? items : []).forEach(item => {
          const prompt = getPromptText(item);
          addPromptMapping(map, item.thumb, prompt);
          addPromptMapping(map, item.videoUrl, prompt);
          (Array.isArray(item.outputs) ? item.outputs : []).forEach(u => addPromptMapping(map, u, prompt));
        });
        return map;
      } catch {
        return new Map();
      }
    }

    async function loadGallery() {
      const meta = document.getElementById('meta');
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      meta.textContent = 'Loading outputs...';
      empty.style.display = 'none';
      grid.innerHTML = '';

      try {
        const [r, promptMap] = await Promise.all([
          fetch('/api/outputs'),
          fetchHistoryMap(),
        ]);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const files = Array.isArray(data.files) ? data.files : [];
        files.forEach(file => addPromptMapping(promptMap, `/outputs/${encodeURIComponent(file.name || '')}`, file.prompt));
        promptByOutput = promptMap;
        meta.textContent = files.length + ' output' + (files.length === 1 ? '' : 's');

        if (!files.length) {
          empty.style.display = 'block';
          return;
        }

        files.forEach(f => {
          const name = f.name || '';
          const url = '/outputs/' + encodeURIComponent(name);
          const isVideo = /\.(mp4|webm)$/i.test(name);
          const hasPrompt = Boolean(promptByOutput.get(normalizeOutputUrl(url)));
          const copyState = hasPrompt
            ? 'title="Copy prompt" aria-label="Copy prompt"'
            : 'disabled title="No prompt was stored for this older output" aria-label="No prompt stored"';
          const card = document.createElement('div');
          card.className = 'card';

          if (isVideo) {
            card.innerHTML = `
              <video src="${esc(url)}" controls playsinline preload="metadata"></video>
              <div class="info">
                <span class="name" title="${esc(name)}">${esc(name)}</span>
                <div class="card-actions">
                  <button class="btn copy-prompt-btn" style="padding:4px 8px" ${copyState}>${hasPrompt ? 'Copy prompt' : 'No prompt'}</button>
                  <button class="btn save-output-btn" style="padding:4px 8px">Save</button>
                  <button class="btn delete-output-btn" style="padding:4px 8px;border-color:#ef444466;color:#ef4444">Delete</button>
                </div>
              </div>`;
          } else {
            card.innerHTML = `
              <img src="${esc(url)}" alt="${esc(name)}" loading="lazy">
              <div class="info">
                <span class="name" title="${esc(name)}">${esc(name)}</span>
                <div class="card-actions">
                  <button class="btn copy-prompt-btn" style="padding:4px 8px" ${copyState}>${hasPrompt ? 'Copy prompt' : 'No prompt'}</button>
                  <button class="btn save-output-btn" style="padding:4px 8px">Save</button>
                  <button class="btn delete-output-btn" style="padding:4px 8px;border-color:#ef444466;color:#ef4444">Delete</button>
                </div>
              </div>`;
          }
          const copyBtn = card.querySelector('.copy-prompt-btn');
          if (copyBtn && hasPrompt) copyBtn.addEventListener('click', () => copyPromptForUrl(url, copyBtn));
          const preview = card.querySelector('img');
          if (preview) preview.addEventListener('click', () => openImage(url));
          card.querySelector('.save-output-btn')?.addEventListener('click', () => download(url, name));
          const deleteBtn = card.querySelector('.delete-output-btn');
          deleteBtn?.addEventListener('click', () => deleteOutput(name, deleteBtn));
          grid.appendChild(card);
        });
      } catch (e) {
        meta.textContent = 'Could not load outputs: ' + e.message;
      }
    }

    async function deleteOutput(filename, btn) {
      if (!confirm('Delete this output from server and history?')) return;
      try {
        btn.disabled = true;
        const r = await fetch('/api/output/' + encodeURIComponent(filename), { method: 'DELETE' });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        const card = btn.closest('.card');
        if (card) card.remove();
        if (typeof enhancedGalleryFiles !== 'undefined') {
          enhancedGalleryFiles = enhancedGalleryFiles.filter(file => file.name !== filename);
          selectedGalleryOutputs.delete(filename);
          updateGalleryAlbumOptions();
          renderEnhancedGallery();
        }
        const count = document.querySelectorAll('#grid .card').length;
        document.getElementById('meta').textContent = count + ' output' + (count === 1 ? '' : 's');
        if (!count) document.getElementById('empty').style.display = 'block';
      } catch (e) {
        alert('Delete failed: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (document.getElementById('duplicatesModal').classList.contains('show')) closeDuplicatesModal();
      else if (document.getElementById('copyFallback').classList.contains('show')) closeCopyFallback();
      else if (document.getElementById('lightbox').classList.contains('show')) closeLightbox();
    });

    loadEnhancedGallery();
  </script>
</body>
</html>
